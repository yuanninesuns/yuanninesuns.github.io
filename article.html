<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>文章 · 鲸的世界</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="site-title">鲸的世界</a>
      <p class="site-philosophy">探索 &middot; 体验 &middot; 修炼 &middot; 精神 &middot; 物质 &middot;肉体</p>
    </div>
  </header>

  <div class="article-page" id="articleContainer">
    <a href="index.html" class="back-link">← 返回首页</a>
    <div id="articleContent"><p style="color:#888;text-align:center;padding:60px 0;">加载中……</p></div>
  </div>

  <footer class="site-footer">
    <p id="footerText">© 鲸的世界 &nbsp;·&nbsp; 探索 体验 修炼 精神 物质 肉体</p>
    <p class="site-counter">
      访客数 <span id="busuanzi_value_site_uv">--</span> &nbsp;·&nbsp;
      访问量 <span id="busuanzi_value_site_pv">--</span>
    </p>
  </footer>

  <!-- marked.js for Markdown → HTML -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script defer src="https://vercount.one/js"></script>

  <script>
    // Category label mapping
    const catLabels = {
      finance: '理财', career: '职场', love: '感情',
      book: '书评', film: '影评', essay: '随笔'
    };

    // Parse YAML-style frontmatter (simple key: value pairs between --- markers)
    function parseFrontmatter(text) {
      const match = text.match(/^---\s*\n([\s\S]*?)\n---\s*\n([\s\S]*)$/);
      if (!match) return { meta: {}, body: text };
      const meta = {};
      match[1].split('\n').forEach(line => {
        const colonIdx = line.indexOf(':');
        if (colonIdx === -1) return;
        const key = line.slice(0, colonIdx).trim();
        let val = line.slice(colonIdx + 1).trim();
        // Remove surrounding quotes if present
        if ((val.startsWith('"') && val.endsWith('"')) ||
            (val.startsWith("'") && val.endsWith("'"))) {
          val = val.slice(1, -1);
        }
        // Parse arrays like [a, b, c]
        if (val.startsWith('[') && val.endsWith(']')) {
          val = val.slice(1, -1).split(',').map(v => v.trim().replace(/['"]/g, ''));
        }
        meta[key] = val;
      });
      return { meta, body: match[2] };
    }

    async function loadArticle() {
      const params = new URLSearchParams(window.location.search);
      const src = params.get('src');
      if (!src) {
        document.getElementById('articleContent').innerHTML =
          '<p style="color:#c00;text-align:center;padding:60px 0;">未指定文章路径（缺少 ?src= 参数）</p>';
        return;
      }

      // Detect file:// protocol — fetch() is blocked by browsers in this case
      if (location.protocol === 'file:') {
        document.getElementById('articleContent').innerHTML = `
          <div style="background:#fff8e1;border-left:4px solid #f5a623;padding:24px 28px;border-radius:0 8px 8px 0;margin-top:20px;">
            <p style="font-weight:700;margin-bottom:12px;">⚠️ 请通过本地服务器打开</p>
            <p style="color:#555;margin-bottom:16px;">直接用浏览器打开本地文件时，fetch 请求会被安全策略阻止。</p>
            <p style="color:#555;margin-bottom:8px;">在项目目录下运行以下任意一条命令启动本地服务器：</p>
            <pre style="background:#f5f5f5;padding:12px 16px;border-radius:6px;font-size:.88rem;overflow-x:auto;">python3 -m http.server 8080</pre>
            <p style="color:#555;margin:10px 0 8px;">然后在浏览器访问：</p>
            <pre style="background:#f5f5f5;padding:12px 16px;border-radius:6px;font-size:.88rem;">http://localhost:8080</pre>
            <p style="color:#888;font-size:.85rem;margin-top:12px;">提示：部署到 GitHub Pages 后无需任何额外配置，直接正常访问。</p>
          </div>`;
        return;
      }

      let text;
      try {
        const resp = await fetch(src);
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        text = await resp.text();
      } catch (e) {
        document.getElementById('articleContent').innerHTML =
          `<p style="color:#c00;text-align:center;padding:60px 0;">文章加载失败：${e.message}</p>`;
        return;
      }

      const { meta, body } = parseFrontmatter(text);
      const title   = meta.title   || '无题';
      const cat     = meta.category || '';
      const date    = meta.date    || '';
      const tags    = Array.isArray(meta.tags) ? meta.tags : (meta.tags ? [meta.tags] : []);

      // Update page title
      document.title = title + ' · 鲸的世界';

      // Build header HTML
      const badgeHtml = cat
        ? `<span class="cat-badge ${cat}">${catLabels[cat] || cat}</span>`
        : '';
      const dateHtml = date ? `<p class="article-date">${date}</p>` : '';
      const tagsHtml = tags.length
        ? `<div class="article-footer"><span class="label">标签：</span>${tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>`
        : '';

      // Pre-process: extract movie-table blocks before passing to marked
      // Replace ```movie-table ... ``` with a placeholder <div>
      const movieTables = [];
      const processedBody = body.replace(
        /```movie-table\s*\n([\s\S]*?)```/g,
        (_, json) => {
          const idx = movieTables.length;
          try {
            movieTables.push(JSON.parse(json.trim()));
          } catch {
            movieTables.push(null);
          }
          return `<div class="movie-table-placeholder" data-idx="${idx}"></div>`;
        }
      );

      // Render markdown body
      const bodyHtml = marked.parse(processedBody);

      document.getElementById('articleContent').innerHTML = `
        <div class="article-header">
          ${badgeHtml}
          <h1>${title}</h1>
          ${dateHtml}
        </div>
        <div class="article-body">${bodyHtml}</div>
        ${tagsHtml}
      `;

      // Replace placeholders with actual sortable tables
      document.querySelectorAll('.movie-table-placeholder').forEach(el => {
        const idx = parseInt(el.dataset.idx);
        const data = movieTables[idx];
        if (!data) { el.outerHTML = '<p style="color:#c00">表格数据解析失败</p>'; return; }
        el.outerHTML = buildMovieTable(data);
      });

      // Attach sort listeners
      document.querySelectorAll('.movie-sort-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const table = btn.closest('.movie-table-wrap');
          const field = btn.dataset.field;
          const current = btn.dataset.order || 'desc';
          const next = current === 'desc' ? 'asc' : 'desc';

          // Reset all buttons in this table
          table.querySelectorAll('.movie-sort-btn').forEach(b => {
            b.dataset.order = '';
            b.classList.remove('sort-asc', 'sort-desc');
          });

          btn.dataset.order = next;
          btn.classList.add(next === 'asc' ? 'sort-asc' : 'sort-desc');

          const tbody = table.querySelector('tbody');
          const rows = [...tbody.querySelectorAll('tr')];
          rows.sort((a, b) => {
            const aVal = parseFloat(a.dataset[field]);
            const bVal = parseFloat(b.dataset[field]);
            return next === 'desc' ? bVal - aVal : aVal - bVal;
          });
          rows.forEach(r => tbody.appendChild(r));
        });
      });
    }

    function buildMovieTable(data) {
      const rows = data.map((m, i) =>
        `<tr data-score="${m.score}" data-year="${m.year}">
          <td>${i + 1}</td>
          <td>${m.title}</td>
          <td>${m.score}</td>
          <td>${m.year}</td>
        </tr>`
      ).join('');

      return `
        <div class="movie-table-wrap">
          <div class="movie-sort-bar">
            排序：
            <button class="movie-sort-btn" data-field="score" data-order="">评分</button>
            <button class="movie-sort-btn" data-field="year"  data-order="">年份</button>
          </div>
          <table class="movie-table">
            <thead>
              <tr><th>#</th><th>电影</th><th>评分</th><th>年份</th></tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>`;
    }

    loadArticle();
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>文章 · 鲸的世界</title>
  <link rel="stylesheet" href="style.css?v=20261003-asset-chart" />
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="site-title">鲸的世界</a>
      <p class="site-philosophy">探索 &middot; 体验 &middot; 修炼 &middot; 精神 &middot; 财富 &middot;肉体</p>
    </div>
  </header>

  <div class="article-page" id="articleContainer">
    <a href="index.html" class="back-link">← 返回首页</a>
    <div id="articleContent"><p style="color:#888;text-align:center;padding:60px 0;">加载中……</p></div>
  </div>

  <footer class="site-footer">
    <p id="footerText">© 鲸的世界 &nbsp;·&nbsp; 在这里AI记录了一切</p>
  </footer>

  <!-- marked.js for Markdown → HTML -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    window.addEventListener('error', (event) => {
      const target = event.target;
      if (target && target.tagName === 'SCRIPT' && target.src.includes('marked')) {
        const fallback = document.createElement('script');
        fallback.src = 'https://unpkg.com/marked/marked.min.js';
        document.head.appendChild(fallback);
      }
    }, true);
  </script>

  <script>
    // Category label mapping
    const catLabels = {
      finance: '理财', journey: '旅途', emotion: '情感', bookmovie: '书影'
    };

    // Parse YAML-style frontmatter (simple key: value pairs between --- markers)
    function parseFrontmatter(text) {
      const match = text.match(/^---\s*\n([\s\S]*?)\n---\s*\n([\s\S]*)$/);
      if (!match) return { meta: {}, body: text };
      const meta = {};
      match[1].split('\n').forEach(line => {
        const colonIdx = line.indexOf(':');
        if (colonIdx === -1) return;
        const key = line.slice(0, colonIdx).trim();
        let val = line.slice(colonIdx + 1).trim();
        // Remove surrounding quotes if present
        if ((val.startsWith('"') && val.endsWith('"')) ||
            (val.startsWith("'") && val.endsWith("'"))) {
          val = val.slice(1, -1);
        }
        // Parse arrays like [a, b, c]
        if (val.startsWith('[') && val.endsWith(']')) {
          val = val.slice(1, -1).split(',').map(v => v.trim().replace(/['"]/g, ''));
        }
        meta[key] = val;
      });
      return { meta, body: match[2] };
    }

    function waitForMarked(timeout = 5000) {
      return new Promise((resolve, reject) => {
        if (window.marked) { resolve(); return; }
        const start = Date.now();
        const timer = setInterval(() => {
          if (window.marked) {
            clearInterval(timer);
            resolve();
          } else if (Date.now() - start > timeout) {
            clearInterval(timer);
            reject(new Error('Markdown 渲染器加载失败，请刷新页面重试'));
          }
        }, 50);
      });
    }

    async function fetchTextWithRetry(src, retries = 3) {
      let lastError;
      for (let i = 0; i <= retries; i++) {
        try {
          const fetchUrl = `${src}${src.includes('?') ? '&' : '?'}v=${Date.now()}`;
          const resp = await fetch(fetchUrl, { cache: 'no-store' });
          if (!resp.ok) throw new Error('HTTP ' + resp.status);
          return await resp.text();
        } catch (e) {
          lastError = e;
          if (i < retries) {
            await new Promise(resolve => setTimeout(resolve, 300 * (i + 1)));
          }
        }
      }
      throw lastError;
    }

    async function loadArticle() {
      const params = new URLSearchParams(window.location.search);
      const src = params.get('src');
      if (!src) {
        document.getElementById('articleContent').innerHTML =
          '<p style="color:#c00;text-align:center;padding:60px 0;">未指定文章路径（缺少 ?src= 参数）</p>';
        return;
      }

      // Detect file:// protocol — fetch() is blocked by browsers in this case
      if (location.protocol === 'file:') {
        document.getElementById('articleContent').innerHTML = `
          <div style="background:#fff8e1;border-left:4px solid #f5a623;padding:24px 28px;border-radius:0 8px 8px 0;margin-top:20px;">
            <p style="font-weight:700;margin-bottom:12px;">⚠️ 请通过本地服务器打开</p>
            <p style="color:#555;margin-bottom:16px;">直接用浏览器打开本地文件时，fetch 请求会被安全策略阻止。</p>
            <p style="color:#555;margin-bottom:8px;">在项目目录下运行以下任意一条命令启动本地服务器：</p>
            <pre style="background:#f5f5f5;padding:12px 16px;border-radius:6px;font-size:.88rem;overflow-x:auto;">python3 -m http.server 8080</pre>
            <p style="color:#555;margin:10px 0 8px;">然后在浏览器访问：</p>
            <pre style="background:#f5f5f5;padding:12px 16px;border-radius:6px;font-size:.88rem;">http://localhost:8080</pre>
            <p style="color:#888;font-size:.85rem;margin-top:12px;">提示：部署到 GitHub Pages 后无需任何额外配置，直接正常访问。</p>
          </div>`;
        return;
      }

      let text;
      try {
        text = await fetchTextWithRetry(src, 4);
      } catch (e) {
        document.getElementById('articleContent').innerHTML =
          `<p style="color:#c00;text-align:center;padding:60px 0;">文章加载失败：${e.message}</p>`;
        return;
      }

      try {
        await waitForMarked();

        const { meta, body } = parseFrontmatter(text);
      const title   = meta.title   || '无题';
      const cat     = meta.category || '';
      const date    = meta.date    || '';
      const tags    = Array.isArray(meta.tags) ? meta.tags : (meta.tags ? [meta.tags] : []);

      // Update page title
      document.title = title + ' · 鲸的世界';

      // Build header HTML
      const badgeHtml = cat
        ? `<span class="cat-badge ${cat}">${catLabels[cat] || cat}</span>`
        : '';
      const dateHtml = date ? `<p class="article-date">${date}</p>` : '';
      const tagsHtml = tags.length
        ? `<div class="article-footer"><span class="label">标签：</span>${tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>`
        : '';

      // Pre-process: extract special code blocks before passing to marked
      const movieTables = [];
      const journeyTables = [];
      const assetAllocations = [];

      let processedBody = body.replace(
        /```movie-table\s*\n([\s\S]*?)```/g,
        (_, json) => {
          const idx = movieTables.length;
          try { movieTables.push(JSON.parse(json.trim())); } catch { movieTables.push(null); }
          return `<div class="movie-table-placeholder" data-idx="${idx}"></div>`;
        }
      );

      processedBody = processedBody.replace(
        /```journey-table\s*\n([\s\S]*?)```/g,
        (_, json) => {
          const idx = journeyTables.length;
          try { journeyTables.push(JSON.parse(json.trim())); } catch { journeyTables.push(null); }
          return `<div class="journey-table-placeholder" data-idx="${idx}"></div>`;
        }
      );

      processedBody = processedBody.replace(
        /```asset-allocation\s*\n([\s\S]*?)```/g,
        (_, json) => {
          const idx = assetAllocations.length;
          try { assetAllocations.push(JSON.parse(json.trim())); } catch { assetAllocations.push(null); }
          return `<div class="asset-allocation-placeholder" data-idx="${idx}"></div>`;
        }
      );

      // Render markdown body
      const bodyHtml = marked.parse(processedBody);

      document.getElementById('articleContent').innerHTML = `
        <div class="article-header">
          ${badgeHtml}
          <h1>${title}</h1>
          ${dateHtml}
        </div>
        <div class="article-body">${bodyHtml}</div>
        ${tagsHtml}
      `;

      // Replace movie-table placeholders
      document.querySelectorAll('.movie-table-placeholder').forEach(el => {
        const idx = parseInt(el.dataset.idx);
        const data = movieTables[idx];
        if (!data) { el.outerHTML = '<p style="color:#c00">表格数据解析失败</p>'; return; }
        el.outerHTML = buildMovieTable(data);
      });

      // Replace journey-table placeholders
      document.querySelectorAll('.journey-table-placeholder').forEach(el => {
        const idx = parseInt(el.dataset.idx);
        const data = journeyTables[idx];
        if (!data) { el.outerHTML = '<p style="color:#c00">表格数据解析失败</p>'; return; }
        el.outerHTML = buildJourneyTable(data);
      });

      // Replace asset-allocation placeholders
      document.querySelectorAll('.asset-allocation-placeholder').forEach(el => {
        const idx = parseInt(el.dataset.idx);
        const data = assetAllocations[idx];
        if (!data) { el.outerHTML = '<p style="color:#c00">资产配置数据解析失败</p>'; return; }
        el.outerHTML = buildAssetAllocationChart(data);
      });

      // Attach sort listeners for journey table
      document.querySelectorAll('.journey-sort-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const wrap = btn.closest('.journey-table-wrap');
          const current = btn.dataset.order || 'desc';
          const next = current === 'desc' ? 'asc' : 'desc';
          btn.dataset.order = next;
          btn.classList.remove('sort-asc', 'sort-desc');
          btn.classList.add(next === 'asc' ? 'sort-asc' : 'sort-desc');
          const tbody = wrap.querySelector('tbody');
          const rows = [...tbody.querySelectorAll('tr')];
          rows.sort((a, b) => {
            const aY = parseInt(a.dataset.year) || 9999;
            const bY = parseInt(b.dataset.year) || 9999;
            return next === 'desc' ? bY - aY : aY - bY;
          });
          rows.forEach(r => tbody.appendChild(r));
        });
      });

      // Attach sort listeners for movie table
      document.querySelectorAll('.movie-sort-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const table = btn.closest('.movie-table-wrap');
          const field = btn.dataset.field;
          const current = btn.dataset.order || 'desc';
          const next = current === 'desc' ? 'asc' : 'desc';
          table.querySelectorAll('.movie-sort-btn').forEach(b => {
            b.dataset.order = '';
            b.classList.remove('sort-asc', 'sort-desc');
          });
          btn.dataset.order = next;
          btn.classList.add(next === 'asc' ? 'sort-asc' : 'sort-desc');
          const tbody = table.querySelector('tbody');
          const rows = [...tbody.querySelectorAll('tr')];
          rows.sort((a, b) => {
            const aVal = parseFloat(a.dataset[field]);
            const bVal = parseFloat(b.dataset[field]);
            return next === 'desc' ? bVal - aVal : aVal - bVal;
          });
          rows.forEach(r => tbody.appendChild(r));
        });
      });
      } catch (e) {
        document.getElementById('articleContent').innerHTML =
          `<p style="color:#c00;text-align:center;padding:60px 0;">文章渲染失败：${e.message}</p>`;
      }
    }

    function buildAssetAllocationChart(data) {
      const colors = ['#4a7c59', '#bf8a3a', '#d7ad4b', '#5b6abf', '#8a6bbf', '#3a9fbf', '#9a9a9a', '#7f6f5f'];
      const totalTarget = data.reduce((sum, item) => sum + Number(item.target || 0), 0) || 1;
      const totalActual = data.reduce((sum, item) => sum + Number(item.actual || 0), 0) || 1;

      const withColor = data.map((item, index) => ({
        ...item,
        color: colors[index % colors.length],
        target: Number(item.target || 0),
        actual: Number(item.actual || 0)
      }));

      const targetPie = buildPieStyle(withColor, 'target', totalTarget);
      const actualPie = buildPieStyle(withColor, 'actual', totalActual);

      const legendRows = withColor.map(item => {
        const diff = item.actual - item.target;
        const diffText = `${diff > 0 ? '+' : ''}${diff}%`;
        const diffClass = diff > 0 ? 'positive' : diff < 0 ? 'negative' : 'zero';
        return `
          <tr>
            <td><span class="asset-color" style="background:${item.color}"></span>${item.name}</td>
            <td>${item.target}%</td>
            <td>${item.actual}%</td>
            <td class="asset-diff ${diffClass}">${diffText}</td>
          </tr>`;
      }).join('');

      return `
        <section class="asset-card">
          <div class="asset-chart-grid">
            <div class="asset-pie-panel">
              <h3>目标配置</h3>
              <div class="asset-pie" style="background:${targetPie}"></div>
            </div>
            <div class="asset-pie-panel">
              <h3>实际配置</h3>
              <div class="asset-pie" style="background:${actualPie}"></div>
            </div>
          </div>
          <div class="asset-legend-wrap">
            <table class="asset-legend">
              <thead>
                <tr><th>资产</th><th>目标</th><th>实际</th><th>差值</th></tr>
              </thead>
              <tbody>${legendRows}</tbody>
            </table>
          </div>
        </section>`;
    }

    function buildPieStyle(data, field, total) {
      let start = 0;
      const slices = data
        .filter(item => item[field] > 0)
        .map(item => {
          const end = start + (item[field] / total) * 100;
          const slice = `${item.color} ${start}% ${end}%`;
          start = end;
          return slice;
        });

      return slices.length ? `conic-gradient(${slices.join(', ')})` : '#eee';
    }

    function buildJourneyTable(data) {
      const rows = data.map(item =>
        `<tr data-year="${item.year || 9999}">
          <td class="journey-quote">${item.quote}</td>
          <td class="journey-story">${item.story || ''}</td>
          <td class="journey-year">${item.year || '—'}</td>
        </tr>`
      ).join('');

      return `
        <div class="journey-table-wrap">
          <div class="movie-sort-bar">
            排序：
            <button class="journey-sort-btn" data-order="">时间</button>
          </div>
          <table class="journey-table">
            <thead>
              <tr><th>一句话</th><th>经历</th><th>时间</th></tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>`;
    }

    function buildMovieTable(data) {
      const rows = data.map((m, i) =>
        `<tr data-score="${m.score}" data-year="${m.year}">
          <td>${i + 1}</td>
          <td>${m.title}</td>
          <td>${m.score}</td>
          <td>${m.year}</td>
        </tr>`
      ).join('');

      return `
        <div class="movie-table-wrap">
          <div class="movie-sort-bar">
            排序：
            <button class="movie-sort-btn" data-field="score" data-order="">评分</button>
            <button class="movie-sort-btn" data-field="year"  data-order="">年份</button>
          </div>
          <table class="movie-table">
            <thead>
              <tr><th>#</th><th>电影</th><th>评分</th><th>年份</th></tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>`;
    }

    loadArticle();
  </script>

</body>
</html>
